name: Build V8 Engine (Windows)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up dependencies
      run: |
        choco install git python3
        python -m pip install --upgrade pip
        python -m pip install gyp
        choco install visualstudio2019buildtools --package-parameters "--includeRecommended --allWorkloads"
        choco install cmake
        choco install ninja

    - name: Install depot_tools
      run: |
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
        echo "depot_tools path: $(pwd)/depot_tools"
        echo "depot_tools=$(pwd)/depot_tools" >> $GITHUB_ENV
        echo "$(pwd)/depot_tools" >> $env:GITHUB_PATH

    - name: Set up environment for V8 build
      run: |
        # Ensure depot_tools is in PATH
        $gnPath = "$(pwd)/depot_tools/gn"
        & $gnPath gen out.gn/x64.release --args="is_debug=false is_component_build=false v8_static_library=true v8_use_external_startup_data=false v8_use_glibcxx=false target_cpu=\"x64\""

    - name: Build static and dynamic libraries
      run: |
        # Build static library
        $gnPath = "$(pwd)/depot_tools/gn"
        & $gnPath gen out.gn/x64.static --args="is_debug=false is_component_build=false v8_static_library=true v8_use_external_startup_data=false target_cpu=\"x64\""
        
        # Build dynamic library
        $gnPath = "$(pwd)/depot_tools/gn"
        & $gnPath gen out.gn/x64.dynamic --args="is_debug=false is_component_build=true v8_use_external_startup_data=false target_cpu=\"x64\""
        
        # Build with ninja
        $ninjaPath = "$(pwd)/depot_tools/ninja"
        & $ninjaPath -C out.gn/x64.static v8_monolith
        & $ninjaPath -C out.gn/x64.dynamic v8_monolith

    - name: Verify V8 build
      run: |
        # Verify static build
        & out.gn/x64.static/d8 --version
        
        # Verify dynamic build
        & out.gn/x64.dynamic/d8 --version
